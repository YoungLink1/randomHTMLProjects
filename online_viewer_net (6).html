<html>
<head>
    <title>Remaining Assignments</title>
    <style>
        body {
            font-family: sans-serif;
        }
        
        span {
            cursor: default;
        }
        
        span + div[type=submessage] {
            opacity: 0%;
            display: inline;
            position: absolute;
            left: 16px;
            translate: -200px;
            transform: translateY(12px);
            
            z-index: 1;
            border-radius: 8px;
            border-top: 2px solid rgba(255, 191, 255, 0.8);
            border-left: 2px solid rgba(255, 191, 255, 0.8);
            border-bottom: 2px solid rgba(159, 95, 159, 0.8);
            border-right: 2px solid rgba(159, 95, 159, 0.8);
            background: rgba(191, 127, 191, 0.5);
            backdrop-filter: blur(2px);
            padding: 2px;
            box-shadow: inset 0 1px 5px 4px rgba(255, 191, 255, 0.5), inset 0 -1px 5px 4px rgba(159, 95, 159, 0.5), inset 0 0 0 -4px rgba(191, 127, 191, 0.5);
            
            transition: opacity 0.1s, transform 0.2s linear(0, 2, 6, 2.5, 1.25, 1);
        }
        
        span:hover + div[type=submessage] {
            opacity: 100%;
            translate: 0px;
            transform: translateY(14px);
        }
        
        span + div[type=submessage] a {
            color: rgb(0, 0, 159);
            text-decoration: none;
        }
        
        ul {
            transform: translate(-20px, -10px);
            cursor: default;
        }
        
        ul > li:has(input[type=checkbox]) {
            z-index: 0;
            opacity: 100%;
            transform: translate(-24px);
            transition: opacity 0.1s, transform 0.1s;
        }
        
        ul > li:has(input[type=checkbox]:checked) {
            opacity: 50%;
            text-decoration: line-through;
            transform: translate(-20px);
        }
        
        ul > li:has(input[type=checkbox])::marker {
            color: rgba(255, 255, 255, 0);
        }
        
        ul > li[subtask]:has(input[type=checkbox]) {
            transform: translate(-16px);
        }
        
        ul > li > input[type=checkbox] {
            appearance: none;
            outline: 1px solid black;
            height: 10px;
            width: 10px;
            border-radius: 16px;
            background: rgb(127, 191, 255);
            transform: translate(0px, 2px);
        }
        
        ul > li > input[type=checkbox]:hover {cursor: pointer;}
        
        ul > li > input[type=checkbox]:checked {background: rgb(255, 127, 191);}
        
        .bgSquare {
            width: 100px;
            height: 100px;
            
            position: fixed;
            top: 0px;
            left: 0px;
            z-index: -1;
            
            /* From https://css.glass */
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid rgba(238, 139, 66, 0.3);
            
            animation: drift 20s ease-in-out infinite alternate;
        }
        
        @keyframes drift {
            0% {
               transform: translate(var(--rand-x, 0px), var(--rand-y, 0px)) rotate(var(--rand-rot, 0deg)); 
            }
        }
    </style>
    <script defer>
        function getRandom(max) { // Basic Utility Function
            return Math.floor(Math.random() * max);
        }
        
        document.querySelectorAll('.bgSquare').forEach(el => {
            // Calculate bounds so squares don't bleed off the screen edges
            const maxX = window.innerWidth - 120;
            const maxY = window.innerHeight - 120;
            
            // Generate full-screen coordinates
            const randomX = getRandom(maxX);
            const randomY = getRandom(maxY);
            const randomRot = getRandom(360);
            
            // Apply the values to the element
            el.style.setProperty('--rand-x', `${randomX}px`);
            el.style.setProperty('--rand-y', `${randomY}px`);
            el.style.setProperty('--rand-rot', `${randomRot}deg`);
        });
    </script>
</head>
