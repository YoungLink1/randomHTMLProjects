<!DOCTYPE html>
<html>
<head>
    <style>
        input[type="checkbox"] {
            appearance: none;
            background-color: red;

            border-radius: px;
            
            position: absolute;
            width: 48px;
            height: 16px;
        }
        
        input[type="checkbox"]:checked {
            background-color: green;
        }
        
        input[type="checkbox"] + .cbslider{
            background-color: #aaaaaa;
            font-size: 0px;
            pointer-events: none;
            
            position: relative;
            left: 0px;
            top: -1px;
            
            min-width: 24px;
            min-height: 24px;
            max-width: 24px;
            max-height: 24px;
            border-radius: 24px;
            
            transition: left 0.1s linear;
        }
        
        input[type="checkbox"]:checked + .cbslider{
            left: 32px;
        }
    </style>    
</head>

<body>
    <div class="checkbox">
        <input type="checkbox">
        <div class="cbslider">_</div>
    </div>
</body>
</html>
